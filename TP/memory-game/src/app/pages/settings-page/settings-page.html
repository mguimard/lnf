<div class="bg-slate-900 min-h-screen px-4 py-10 text-white">

    <div class="mx-auto max-w-xl">
        <!-- Settings card -->
        <form class="space-y-8 rounded-3xl border border-slate-800 bg-slate-900 p-6 shadow-2xl sm:p-8">

            <!-- Number of pairs -->
            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-200">
                    Number of pairs
                </label>

                <p class="mb-3 text-sm text-slate-400">
                    Choose how many pairs you want to find.
                </p>

                <input type="number" data-testid="pairs-input" [formField]="settingsForm.pairs"
                    class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-white outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20" />
            </div>

            <div class="border-t border-slate-800"></div>

            <!-- Border color -->
            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-200">
                    Card border color
                </label>

                <p class="mb-4 text-sm text-slate-400">
                    Choose the color used for your cards.
                </p>

                <div class="flex items-center gap-4 rounded-xl border border-slate-700 bg-slate-800 p-4">
                    <input type="color" [formField]="settingsForm.borderColor"
                        class="h-12 w-16 cursor-pointer rounded-lg border-0 bg-transparent" />

                    <div>
                        <p class="text-sm font-medium text-white">
                            Custom color
                        </p>
                        <p class="text-xs text-slate-400">
                            Pick your favorite color
                        </p>
                    </div>
                </div>
            </div>

        </form>

    </div>
</div>
