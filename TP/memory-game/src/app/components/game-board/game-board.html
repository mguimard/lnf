<div class="bg-slate-900 min-h-screen px-4 py-10 text-white">
    <div class="mx-auto max-w-5xl">

        <!-- Timer -->
        <div class="mb-8 flex flex-wrap items-center gap-4">
            <div class="flex items-center gap-3 rounded-2xl border border-slate-700 bg-slate-800 px-6 py-4 shadow-lg">
                <span class="text-2xl">⏱️</span>
                <div>
                    <p class="text-xs font-medium uppercase tracking-wider text-slate-400">
                        Temps écoulé
                    </p>
                    <p class="text-xl font-bold tabular-nums text-white">
                        {{ (1000 * game.time()) | durationHumanReadable }}
                    </p>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-3 rounded-2xl  shadow-lg">
                <button (click)="restart()"
                    class="rounded-xl bg-blue-600 px-8 py-3 font-semibold text-white shadow-lg shadow-blue-600/20 transition hover:bg-blue-500 active:scale-95">
                    ↻ Restart
                </button>

                <button (click)="cheat()"
                    class="rounded-xl border border-slate-700 bg-slate-800 px-8 py-3 font-semibold text-slate-200 transition hover:border-slate-500 hover:bg-slate-700 active:scale-95">
                    ✨ Solve
                </button>
            </div>
        </div>

        <!-- Game grid -->
        <section class="rounded-3xl border border-slate-800 bg-slate-800 p-4 shadow-2xl sm:p-8">

            <div class="mb-6 flex items-center justify-between">
                <h2 class="text-lg font-bold">Grille</h2>
                <span class="rounded-full bg-slate-800 px-3 py-1 text-xs font-medium text-slate-400">
                    {{ game.grid().length }} cards
                </span>
            </div>

            <div class="flex flex-wrap justify-center gap-3 sm:gap-4">
                @for (card of game.grid(); track $index) {
                <app-card-item class="transition-transform duration-200 hover:scale-105" [appBorderColor]="borderColor"
                    [card]="card" (click)="reveal(card)">
                </app-card-item>
                }
            </div>

            <!-- Victory -->
            @if (game.gameOver()) {
            <div class="mt-8 rounded-2xl border border-emerald-500/30 bg-emerald-500/10 p-6 text-center">
                <div class="mb-2 text-4xl">🏆</div>
                <h3 class="text-2xl font-extrabold text-emerald-400">
                    Bravo !
                </h3>
                <p class="mt-2 text-sm text-emerald-200/70">
                    Toutes les paires ont été trouvées !
                </p>
            </div>
            }

        </section>



    </div>
</div>
