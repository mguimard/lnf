<p>Temps écoulé : {{ (1000*time()) | durationHumanReadable}}</p>

<p>Scores</p>
<ul>
    @for (score of scores(); track $index) {
    <li>{{score.timestamp}} - {{score.name}} : {{ score.duration_ms | durationHumanReadable }}</li>
    }

</ul>

<p [style.color]="borderColor">Grille</p>

<div>
    @for (card of grid(); track $index) {
    <app-card-item [appBorderColor]="borderColor" [card]="card" (click)="reveal(card)"></app-card-item>
    }
</div>

@if(this.gameOver()){
<p>Bravo !</p>
}

<button (click)="restart()">Restart</button>
<button (click)="cheat()">Auto solve</button>
