user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}
http {
    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html/memory-game/browser;
        index index.html;

        # Angular routing / deep links
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.js$ {
            default_type application/javascript;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.css$ {
            default_type text/css;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Never cache Angular entry point
        location = /index.html {            
            add_header Cache-Control "no-cache";
        }
    }
}